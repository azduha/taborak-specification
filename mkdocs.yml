site_name: Information System — Design Documentation
site_description: Design documentation for the organization's information system.
docs_dir: docs
site_dir: site
use_directory_urls: true

repo_url: https://github.com/azduha/taborak-specification
repo_name: azduha/taborak-specification
# "Edit this page" points at the Markdown source of the current page.
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # GitHub-compatible anchors so links written for GitHub keep working.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.esm.min.mjs

nav:
  - Overview: README.md
  - Glossary:
      - glossary.md
      - Authorization terms: glossary-authorization.md
  - Domain:
      - Overview: domain/01-overview.md
      - Actors and Accounts: domain/02-actors.md
      - Identity and Legacy: domain/03-identity-and-legacy.md
      - Person Data: domain/08-person-data.md
      - Groups and the Unit: domain/04-organization-structure.md
      - Membership Lifecycle: domain/05-membership-lifecycle.md
      - Authorization Model: domain/06-authorization-model.md
      - Audiences and Selectors: domain/06a-audiences-and-selectors.md
      - Events:
          - domain/07-events.md
          - Capacity, Presence, Forms: domain/07a-capacity-presence-and-forms.md
  - Data Model:
      - Conventions: data-model/00-conventions.md
      - Identity: data-model/01-identity.md
      - Attributes: data-model/09-attributes.md
      - Groups: data-model/02-organization.md
      - Membership: data-model/03-membership.md
      - Relationships: data-model/04-relationships.md
      - Authorization:
          - data-model/05-authorization.md
          - Audience, Grammar, Selectors: data-model/05a-audience-and-grammar.md
          - The Expression Tree: data-model/05b-expression-tree.md
          - Access Log and Resolver: data-model/05c-access-log-and-resolver.md
          - Invariants and Seed Data: data-model/05d-invariants-and-seed.md
      - Audit and Import: data-model/06-audit-and-import.md
      - Finance: data-model/07-finance.md
      - Events:
          - data-model/08-events.md
          - Guards and Integrity Checks: data-model/08a-event-guards-and-checks.md
  - Reference:
      - ERD: appendix/erd.md
      - 'ERD: authorization': appendix/erd-a-authorization.md
      - 'ERD: inventory': appendix/erd-b-inventory.md
      - Permission Catalog: appendix/permission-catalog.md
      - 'Permission Catalog: the codes': appendix/permission-catalog-a-codes.md
      - Permission Catalog continued: appendix/permission-catalog-b-roles-and-open-issues.md
      - Removed Concepts: appendix/removed-concepts.md
      - Decision Log:
          - decisions/index.md
          - Rounds 1: decisions/round-01a.md
          - Rounds 1 continued: decisions/round-01b.md
          - Rounds 2-3: decisions/round-02-03.md
          - Round 4: decisions/round-04.md
          - Round 5: decisions/round-05.md
          - Round 6: decisions/round-06.md
          - Rounds 7-8: decisions/round-07-08.md
          - Round 9: decisions/round-09.md
          - Round 10: decisions/round-10a.md
          - Round 10 continued: decisions/round-10b.md
          - Rounds 11-12: decisions/round-11-12.md
          - Round 13: decisions/round-13.md
          - Round 14: decisions/round-14.md
          - Round 15: decisions/round-15.md
      - Open Questions: open-questions.md

site_url: https://azduha.github.io/taborak-specification/
